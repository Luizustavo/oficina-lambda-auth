name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: 'Ação a executar'
        required: true
        default: plan
        type: choice
        options: [plan, apply, destroy]

concurrency:
  group: lambda-auth
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

env:
  AWS_REGION: sa-east-1
  NODE_VERSION: '20'
  TF_IN_AUTOMATION: 'true'
  TF_VAR_aws_profile: ''

jobs:
  # -------------------------------------------------------------------------
  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Testes unitários (cobertura mínima 80%)
        run: npm test -- --coverage

  # -------------------------------------------------------------------------
  plan:
    name: Plan
    runs-on: ubuntu-latest
    needs: test
    # Nao roda em push para main: ali o job Deploy ja planeja e aplica.
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'plan')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      # O Terraform empacota dist/ com archive_file, então o build precisa
      # rodar antes de qualquer plan ou apply.
      - name: Build dos bundles
        run: |
          npm ci
          npm run build

      # A cadeia k8s -> database precisa existir para haver o que planejar.
      # Entre sessões de trabalho ela é destruída para não gerar custo, então
      # ausente é o estado normal, não um defeito.
      #
      # Aqui isso é "pular", não "falhar": um X vermelho permanente num
      # repositório que está correto só ensina todo mundo a ignorar o sinal.
      # O resumo do job diz o que aconteceu, e o job de deploy continua
      # tratando a mesma condição como erro.
      - name: Conferir dependências de infraestrutura
        id: deps
        run: |
          if ./scripts/check-infra-deps.sh; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Plan pulado: a infraestrutura ainda não foi provisionada"
              echo
              echo "Este repositório lê a rede de \`oficina-infra-k8s\` e a connection string de \`oficina-infra-database\`. Sem os dois states não existe estado contra o qual planejar."
              echo
              echo "Aplique na ordem k8s → database e reexecute este workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Format check
        run: terraform -chdir=infra fmt -check -recursive -diff

      - name: Init
        if: steps.deps.outputs.ready == 'true'
        run: terraform -chdir=infra init -input=false

      - name: Validate
        if: steps.deps.outputs.ready == 'true'
        run: terraform -chdir=infra validate -no-color

      - name: Plan
        if: steps.deps.outputs.ready == 'true'
        run: |
          set -euo pipefail
          terraform -chdir=infra plan -input=false -no-color -out=tfplan
          terraform -chdir=infra show -no-color tfplan > plan.txt

      - name: Comentar o plan no PR
        if: steps.deps.outputs.ready == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('plan.txt', 'utf8');
            const LIMIT = 60000;
            if (plan.length > LIMIT) {
              plan = plan.slice(0, LIMIT) + '\n\n... (plan truncado — veja o log completo do job)';
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `#### Terraform Plan — \`oficina-lambda-auth\`\n\n<details><summary>Ver plan</summary>\n\n\`\`\`terraform\n${plan}\n\`\`\`\n\n</details>`,
            });

  # -------------------------------------------------------------------------
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Build dos bundles
        run: |
          npm ci
          npm run build

      - name: Conferir dependências de infraestrutura
        run: ./scripts/check-infra-deps.sh

      - name: Init
        run: terraform -chdir=infra init -input=false

      - name: Apply
        run: terraform -chdir=infra apply -input=false -auto-approve

      - name: Resumo
        run: |
          {
            echo "### Lambda e API Gateway publicados"
            echo '```'
            terraform -chdir=infra output -json \
              | jq -r 'to_entries[] | select(.value.sensitive | not) | "\(.key) = \(.value.value)"'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  destroy:
    name: Destroy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      # archive_file precisa dos arquivos existirem mesmo no destroy.
      - name: Build dos bundles
        run: |
          npm ci
          npm run build

      - name: Init
        run: terraform -chdir=infra init -input=false

      # Este é o PRIMEIRO repositório a ser destruído: ele cria uma regra no
      # security group do RDS, que pertence ao repositório do banco.
      - name: Destroy
        run: terraform -chdir=infra destroy -input=false -auto-approve
